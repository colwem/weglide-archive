name: Archive North America to R2

on:
  schedule:
    # Keep one replacement run pending behind the active 5.5-hour collector.
    # GitHub concurrency replaces older pending runs, so the newest one starts
    # as soon as the active run finishes without overlapping collectors.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      runtime_minutes:
        description: Collector runtime; 330 leaves upload time before the six-hour job limit
        required: true
        default: "330"
        type: number
      max_flights:
        description: New-flight limit; 0 means runtime-limited only
        required: true
        default: "0"
        type: number
      priority_area:
        description: Takeoff region to download first within each day
        required: true
        default: northeast
        type: choice
        options:
          - northeast
          - ne-us
          - na
      min_delay:
        description: Minimum randomized pause between flights in seconds
        required: true
        default: "4"
        type: number
      max_delay:
        description: Maximum randomized pause between flights in seconds
        required: true
        default: "8"
        type: number

permissions:
  contents: read

concurrency:
  group: weglide-r2-archive
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      ARCHIVE_PREFIX: north-america-v1
      COLLECT_RUNTIME_MINUTES: ${{ inputs.runtime_minutes || '330' }}
      COLLECT_MAX_FLIGHTS: ${{ inputs.max_flights || '0' }}
      COLLECT_PRIORITY_AREA: ${{ inputs.priority_area || 'northeast' }}
      COLLECT_MIN_DELAY: ${{ inputs.min_delay || '4' }}
      COLLECT_MAX_DELAY: ${{ inputs.max_delay || '8' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-storage.txt
      - run: pip install -r requirements-storage.txt
      - run: python -m playwright install --with-deps chromium
      - name: Restore durable checkpoint from R2
        id: restore
        run: python r2_storage.py pull --output archive --prefix "$ARCHIVE_PREFIX" --recover-orphan-payloads
      - name: Collect through a virtual display
        id: collector
        shell: bash
        run: |
          set +e
          xvfb-run -a python weglide_archive.py collect \
            --visible --output archive --profile browser-profile \
            --max-runtime-minutes "$COLLECT_RUNTIME_MINUTES" \
            --max-flights "$COLLECT_MAX_FLIGHTS" \
            --priority-area "$COLLECT_PRIORITY_AREA" \
            --r2-sync-every-flights 20 --r2-prefix "$ARCHIVE_PREFIX" \
            --min-delay "$COLLECT_MIN_DELAY" --max-delay "$COLLECT_MAX_DELAY"
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload new files and publish checkpoint last
        if: always() && steps.restore.outcome == 'success'
        run: python r2_storage.py push --output archive --prefix "$ARCHIVE_PREFIX" --prune-uploaded
      - name: Confirm stored R2 state
        if: always() && steps.restore.outcome == 'success'
        run: python r2_storage.py check --prefix "$ARCHIVE_PREFIX"
      - name: Propagate collector failure after preserving state
        if: steps.collector.outputs.exit_code != '0'
        run: exit "${{ steps.collector.outputs.exit_code }}"
