name: Inspect R2 archive

on:
  workflow_dispatch:
    inputs:
      create_download_manifest:
        description: Create a seven-day read-only download manifest
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-storage.txt
      - run: pip install -r requirements-storage.txt
      - name: Build read-only inventory
        run: python r2_storage.py inventory --prefix north-america-v1
      - name: Create read-only download manifest
        if: inputs.create_download_manifest
        run: python r2_storage.py presign --prefix north-america-v1 --expires 604800
      - name: Upload download manifest
        if: inputs.create_download_manifest
        uses: actions/upload-artifact@v4
        with:
          name: r2-download-manifest
          path: r2-download-manifest.jsonl.gz
          retention-days: 1
          compression-level: 0
