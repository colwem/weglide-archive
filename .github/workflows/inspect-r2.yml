name: Inspect R2 archive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-heatmap.txt
      - run: pip install -r requirements-heatmap.txt
      - name: Build New England heat map within the two-hour budget
        run: >-
          python new_england_heatmap.py
          --prefix north-america-v1
          --analysis-prefix analysis/new-england-heatmap-v1
          --output heatmap-output
          --cell-km 5
          --radius-km 40
          --max-runtime-minutes 110
      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-england-heatmap
          path: heatmap-output/
          if-no-files-found: error
          retention-days: 14
