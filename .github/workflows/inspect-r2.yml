name: Inspect R2 archive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-heatmap.txt
      - run: pip install -r requirements-heatmap.txt
      - name: Export all New England-crossing flight paths
        run: python export_new_england_tracks.py --output new_england_tracks.npz
      - uses: actions/upload-artifact@v4
        with:
          name: new-england-flight-tracks
          path: |
            new_england_tracks.npz
            new_england_tracks.json
          retention-days: 7
